# Vendored from zeron (MIT, Copyright 2026 Wing) — see THIRD_PARTY_NOTICES.md.
# Source: https://github.com/zeronsh/zeron, crates/ui @ 8b7afb3.
# Upstream modules are adapted: domain imports (zeron_syntax, zeron_proto, the
# persisted settings store, the gpui_base fork, file-icon theme) are replaced by
# local equivalents, and the modules mono-desk does not use yet are not copied.
[package]
name = "zeron-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gpui = { git = "https://github.com/zeronsh/zui", rev = "b564a34413bb7ef1da04121c4a287758f94993d9" }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
zeron-theme = { path = "../zeron-theme" }
# Installed-font catalog (upstream `crates/ui/src/typography.rs`) and the
# background artwork pipeline (`new_thread_background_{image,effects,mask}.rs`,
# upstream `crates/ui/src/`). Versions match what `gpui` already pins in
# `Cargo.lock`; added by `docs/plans/active/appearance-parity.md`.
fontdb = "0.23"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
