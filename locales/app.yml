About:
  tagline:
    en: A settings-style demo app built with GPUI Kit.
    vi: Ứng dụng demo kiểu cài đặt được xây dựng bằng GPUI Kit.
    zh-CN: 使用 GPUI Kit 构建的设置风格演示应用。
    ja: GPUI Kit で作られた設定風のデモアプリ。
  dialog_title:
    en: About settings-demo
    vi: Giới thiệu settings-demo
    zh-CN: 关于 settings-demo
    ja: settings-demo について
  dialog_body:
    en: Built with GPUI Kit — the Rust desktop framework from Longbridge.
    vi: Được xây dựng bằng GPUI Kit — framework desktop Rust của Longbridge.
    zh-CN: 使用 GPUI Kit 构建 — Longbridge 出品的 Rust 桌面框架。
    ja: GPUI Kit で構築 — Longbridge 製の Rust デスクトップフレームワーク。
