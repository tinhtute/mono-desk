    en: Auto Update
    vi: Tự động cập nhật
    zh-CN: 自动更新
    ja: 自動更新
  auto_update_desc:
    en: Download and install updates automatically.
    vi: Tự động tải và cài đặt bản cập nhật.
    zh-CN: 自动下载并安装更新。
    ja: 更新を自動的にダウンロードしてインストールします。
  notifications_enabled:
    en: Enable Notifications
    vi: Bật thông báo
    zh-CN: 启用通知
    ja: 通知を有効にする
  notifications_enabled_desc:
    en: Allow in-app notifications.
    vi: Cho phép thông báo trong ứng dụng.
    zh-CN: 允许应用内通知。
    ja: アプリ内通知を許可します。
