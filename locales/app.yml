  dark_mode_desc:
    en: Switch between light and dark themes.
    vi: Chuyển đổi giữa giao diện sáng và tối.
    zh-CN: 在浅色和深色主题之间切换。
    ja: ライトテーマとダークテーマを切り替えます。
