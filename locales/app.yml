    zh-CN: 界面基础字体大小，12–18。
    ja: UI の基本フォントサイズ（12〜18）。
  launch_at_login:
    en: Launch at Login
    vi: Khởi động cùng hệ thống
    zh-CN: 登录时启动
    ja: ログイン時に起動
  launch_at_login_desc:
    en: Start the app when you sign in.
    vi: Khởi động ứng dụng khi bạn đăng nhập.
    zh-CN: 登录时启动应用。
    ja: サインイン時にアプリを起動します。
