[package]
name = "mono-desk"
version = "0.1.0"
edition = "2024"

# UI stack: zeron's GPUI fork (MIT). Zeron's own UI source is vendored under
# `vendor/zeron-ui/` and adapted to this settings app — see
# `docs/plans/active/zeron-stack-port.md` and `THIRD_PARTY_NOTICES.md`.
# The rev is pinned exactly; zeron's own workspace manifest pins the same one.
[dependencies]
gpui = { git = "https://github.com/zeronsh/zui", rev = "b564a34413bb7ef1da04121c4a287758f94993d9" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "b564a34413bb7ef1da04121c4a287758f94993d9", features = [
    "font-kit",
    "runtime_shaders",
] }
