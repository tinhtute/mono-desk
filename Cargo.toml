[workspace]
# Vendored zeron crates are workspace members so `cargo test` runs their unit
# tests with the gates. `make lint`/`make fmt` stay scoped to `-p mono-desk`:
# the vendored files keep upstream formatting and carry `#![allow(clippy::all)]`.
members = ["vendor/zeron-theme", "vendor/zeron-ui"]
# Plain `cargo test`/`clippy`/`check` cover the vendored crates too.
default-members = [".", "vendor/zeron-theme", "vendor/zeron-ui"]
resolver = "3"

[package]
name = "mono-desk"
version = "0.1.0"
edition = "2024"

# UI stack: zeron's GPUI fork (MIT). Zeron's own UI source is vendored under
# `vendor/zeron-ui/` and adapted to this settings app — see
# `docs/plans/active/zeron-stack-port.md` and `THIRD_PARTY_NOTICES.md`.
# The rev is pinned exactly; zeron's own workspace manifest pins the same one.
[dependencies]
gpui = { git = "https://github.com/zeronsh/zui", rev = "b564a34413bb7ef1da04121c4a287758f94993d9" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "b564a34413bb7ef1da04121c4a287758f94993d9", features = [
    "font-kit",
    "runtime_shaders",
] }

# Vendored zeron theme domain model (MIT) — tokens/appearance registry used by
# the ported settings surfaces. See THIRD_PARTY_NOTICES.md.
zeron-theme = { path = "vendor/zeron-theme" }

# Vendored/adapted subset of zeron's own UI source (MIT): theme tokens,
# typography, icons, motion, frost and glass. Ported phase by phase — see
# `docs/plans/completed/zeron-stack-port.md` and
# `docs/plans/active/appearance-parity.md`.
zeron-ui = { path = "vendor/zeron-ui" }

# The text field's grapheme-aware cursor movement (`src/settings/text_field.rs`,
# adapted from the zui fork's `crates/gpui/examples/input.rs`). Already in the
# tree through gpui; declared directly because the code calls it.
unicode-segmentation = "1.13"

# Background artwork handling (`src/settings/background.rs`,
# `src/settings/wallpaper_colors.rs`): validate/copy/decode a chosen image and
# extract its dominant color. Same version gpui already resolves.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }

# The theme-library bridge (`src/settings/theme_library.rs`) is ported from
# zeron's `crates/ui/src/theme_library.rs`, which returns `anyhow::Result`; the
# same version already ships with the vendored `zeron-theme` crate.
anyhow = "1"

[dev-dependencies]
# Filesystem isolation for settings/theme-library/background tests.
tempfile = "3"
